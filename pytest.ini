[pytest]
testpaths = tests
# The integration tests drive the real mapping chain and take minutes each, so
# they are kept out of the default run and asked for by name:
#
#     pytest -m integration
#
# They also need the LEAP export fixtures on this machine, and skip themselves
# with a reason when those are absent.
markers =
    integration: exercises a real end-to-end run against local LEAP exports
addopts = -m "not integration"
